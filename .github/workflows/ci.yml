name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: ghc ${{ matrix.ghc }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ghc:
          - "ghc910"

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v27
      name: Install Nix

    # Builds the library and runs the test suite (haskell-flake enables
    # doCheck by default).
    - name: Build and test
      run: |
        nix build -L .#${{ matrix.ghc }}-laop

    # Formatting hooks (stylish-haskell, cabal-gild, nixfmt) and flake outputs.
    - name: Flake check
      run: |
        nix flake check -L
